openapi: 3.0.3
info:
  title: My API
  version: 1.0.0

paths:
  /teacher:
    get:
      tags:
        - Teacher
      summary: Obtener lista paginada de teacher
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Lista paginada de teacher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeacherResponse'

    post:
      tags:
        - Teacher
      summary: Crear un teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeacherDto'
      responses:
        '201':
          description: Teacher creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'

  /teacher/{id}:
    get:
      tags:
        - Teacher
      summary: Obtener un teacher por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Teacher encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'
        '404':
          description: Teacher no encontrado

    put:
      tags:
        - Teacher
      summary: Reemplazar un teacher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeacherDto'
      responses:
        '200':
          description: Teacher actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Teacher'

    delete:
      tags:
        - Teacher
      summary: Eliminar un teacher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Teacher eliminado correctamente

components:
  schemas:
    Teacher:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Juan Pérez

    CreateTeacherDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Juan Pérez

    UpdateTeacherDto:
      type: object
      properties:
        name:
          type: string
          example: Juan Pérez

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42

    PaginatedTeacherResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
