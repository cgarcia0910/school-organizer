openapi: 3.0.3
info:
  title: My API
  version: 1.0.0

paths:
  /course:
    get:
      tags:
        - Course
      summary: Obtener lista paginada de course
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Lista paginada de course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseResponse'

    post:
      tags:
        - Course
      summary: Crear un teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseDto'
      responses:
        '201':
          description: Course creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

  /course/{id}:
    get:
      tags:
        - Course
      summary: Obtener un teacher por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Course no encontrado

    put:
      tags:
        - Course
      summary: Reemplazar un teacher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseDto'
      responses:
        '200':
          description: Course actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

    delete:
      tags:
        - Course
      summary: Eliminar un teacher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Course eliminado correctamente

components:
  schemas:
    Course:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Juan Pérez
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectWorkLoad'
            example: [{id: 1, name: 'Matemáticas'}, {id: 2, name: 'Historia'}]

    CreateCourseDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Juan Pérez
        subjectWorkLoads:
          type: array
          items:
            $ref: '#/components/schemas/SubjectWorkLoad'

    UpdateCourseDto:
      type: object
      properties:
        name:
          type: string
          example: Juan Pérez
        subjectWorkLoads:
          type: array
          items:
            $ref: '#/components/schemas/SubjectWorkLoad'
          

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42

    SubjectWorkLoad:
      type: object
      required:
        - id
        - name
      properties:
        subject:
          $ref: '#/components/schemas/SubjectDto'
        workload:
          $ref: '#/components/schemas/Workload'
    Workload:
      type: object
      required:
        - id
        - name
      properties:
        hoursPerWeek:
          type: integer
          example: 10
        maxDailyWorkload:
          type: integer
          example: 2

    SubjectDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Matemáticas

    PaginatedCourseResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
