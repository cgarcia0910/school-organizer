<div class="breadcrumbs">
    @for (breadcrumb of breadcrumbs$ | async; track breadcrumb; let last = $last) {
        @if (!last) {
            <a routerLink="/{{breadcrumb}}">{{'breadcrumbs.' + breadcrumb | transloco}}</a>&nbsp;>&nbsp;
        } @else {
            <span>{{'breadcrumbs.' + breadcrumb | transloco}}</span>
        }
    }
  </div>
