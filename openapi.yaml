openapi: 3.0.3
info:
  title: My API
  version: 1.0.0

paths:
  /users:
    get:
      tags:
        - User
      summary: Obtener lista de usuarios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
