<form [formGroup]="formController.form" (ngSubmit)="formController.onSubmit()">
    @for (field of formController.getFields(); track field.key) {
        <mat-form-field >
            <input matInput [type]="field.type" [formControlName]="field.key" [placeholder]="field.label" [attr.data-testid]="'input-' + field.key">
        </mat-form-field>
    }
  </form>
