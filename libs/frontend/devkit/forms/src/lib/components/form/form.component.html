<form [formGroup]="formController.form" (ngSubmit)="formController.onSubmit()">
    @for (field of formController.getFields(); track field.key) {
        <mat-form-field >
            <input matInput  [type]="field.type" [formControlName]="field.key" [placeholder]="field.label">
        </mat-form-field>
        <!-- <div *ngIf="userForm.get(field.key)?.touched && userForm.get(field.key)?.invalid">
            Name is required
        </div> -->
    }
  </form>
