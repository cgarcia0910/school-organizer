<div class="toolbar">
    <h2>Gestión de escenarios</h2>
    <button data-testid="add-scenario-button" matButton="tonal" color="primary" aria-label="Add scenario" class="toolbar__action-button" libAddScenario>
      <mat-icon>add</mat-icon>Nuevo escenario
    </button>
  </div>
  <div class="table-container">
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"  [libNavigateTimetableCourse]="element"> {{element.name}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <div class="actions-column">
          <button mat-icon-button [libCalculateScenario]="element">
            <mat-icon>play_circle</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [length]="dataSource.total$ | async" [pageSize]="5" aria-label="Select page"
      (page)="dataSource.fetch($event.pageIndex)">
    </mat-paginator>
  </div>
