<h2 mat-dialog-title>Borrar curso</h2>
<mat-dialog-content>
  <p>¿Estás seguro de querer borrar este curso?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="cancel()">Cancelar</button>
  <button data-testid="confirm-delete-button" matButton (click)="deleteCourse()">Borrar</button>
</mat-dialog-actions>
