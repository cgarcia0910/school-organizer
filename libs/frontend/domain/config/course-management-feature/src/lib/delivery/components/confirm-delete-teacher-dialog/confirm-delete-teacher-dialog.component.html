<h2 mat-dialog-title>Borrar profesor</h2>
<mat-dialog-content>
  <p>¿Estás seguro de querer borrar este profesor?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="cancel()">Cancelar</button>
  <button data-testid="confirm-delete-button" matButton (click)="deleteTeacher()">Borrar</button>
</mat-dialog-actions>
