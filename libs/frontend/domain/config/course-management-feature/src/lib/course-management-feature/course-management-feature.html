<infinite-scroll></infinite-scroll>
<div class="toolbar">
    <h2>{{'config.course.management.title' | transloco}}</h2>
    <button data-testid="add-course-button" matButton="tonal" color="primary" aria-label="Add course" class="toolbar__action-button" libAddCourse>
      <mat-icon>add</mat-icon>{{'config.course.management.actions.add' | transloco}}
    </button>
  </div>
  <div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{'config.course.management.table.columns.name' | transloco}} </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
    <ng-container matColumnDef="habilities">
      <th mat-header-cell *matHeaderCellDef> {{'config.course.management.table.columns.subjects' | transloco}} </th>
      <td mat-cell *matCellDef="let element"> {{getSubjects(element.subjects)}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <div class="actions-column">
          <button mat-icon-button [libUpdateCourse]="element">
            <mat-icon>edit</mat-icon>
          </button>
          <button [attr.data-testid]="'delete-button-'+ element.name" mat-icon-button [libDeleteCourse]="element">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [length]="dataSource.total$ | async" [pageSize]="5" aria-label="Select page"
    (page)="dataSource.fetch($event.pageIndex)">
  </mat-paginator>
</div>
