<div class="toolbar">
    <h2>{{'config.subject.management.title' | transloco}}</h2>
    <button data-testid="add-teacher-button" matButton aria-label="Add teacher" class="toolbar__action-button" libAddTeacher>
      <mat-icon>add</mat-icon>Nuevo profesor
    </button>
  </div>
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>
    <ng-container matColumnDef="habilities">
      <th mat-header-cell *matHeaderCellDef> Habilidades </th>
      <td mat-cell *matCellDef="let element"> {{element.habilities?.join(', ')}} </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button [libUpdateTeacher]="element">
          <mat-icon>edit</mat-icon>
        </button>
        <button [attr.data-testid]="'delete-button-'+ element.name" mat-icon-button [libDeleteTeacher]="element">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator [length]="dataSource.total$ | async" [pageSize]="5" aria-label="Select page"
    (page)="dataSource.fetch($event.pageIndex)">
  </mat-paginator>
