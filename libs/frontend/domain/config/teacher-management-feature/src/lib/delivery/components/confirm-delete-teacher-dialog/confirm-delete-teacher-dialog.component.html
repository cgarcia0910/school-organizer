<h2 mat-dialog-title>{{'config.teacher.management.actions.delete.title' | transloco}}</h2>
<mat-dialog-content>
  <p>{{'config.teacher.management.actions.delete.confirm' | transloco}}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="cancel()">{{'config.teacher.management.actions.delete.cancel' | transloco}}</button>
  <button data-testid="confirm-delete-button" matButton (click)="deleteTeacher()">{{'config.teacher.management.actions.delete.delete' | transloco}}</button>
</mat-dialog-actions>
