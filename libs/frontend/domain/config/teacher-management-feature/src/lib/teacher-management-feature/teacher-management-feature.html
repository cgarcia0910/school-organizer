<div class="toolbar">
  <h2>Gestión de profesores</h2>
  <button matButton aria-label="Add teacher" class="toolbar__action-button" libAddTeacher>
    <mat-icon>add</mat-icon>Nuevo profesor
  </button>
</div>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button [libUpdateTeacher]="element">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button [libDeleteTeacher]="element">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [length]="dataSource.total$ | async" [pageSize]="5" aria-label="Select page"
  (page)="dataSource.fetch($event.pageIndex)">
</mat-paginator>
